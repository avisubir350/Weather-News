name: Staging CI pipeline

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]

jobs:
  continuous-integration:
    runs-on: self-hosted
    steps:
      # 1. Checkout the code
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # needed for sonarqube scanner


      # 2. Setup Python
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      # 3. Install dependencies
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-cov
      # 4. Dependencies Check
      - name: OWASP dependencies
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: "Stagging CI pipeline"
          path: "./"
          format: "ALL"
          output: "dependency-check-report"
      # 3. SonarQube Scanner
      - name: SonarQube Scanner
        uses: sonarsource/sonarcloud-github-action@master
        env:
          GITHUB_SONAR_TOKEN: ${{ secrets.GITHUB_SONAR_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      # 4. Docker Build
      - name: Build Docker Image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/github_tool:${{ github.sha }} .

      # 5. Docker Push
      - name: Push Docker Image
        run: |
          echo ${{ secrets.DOCKER_PASSWORD }} | docker login -u ${{ secrets.DOCKER_USERNAME }} --password-stdin
          docker push ${{ secrets.DOCKER_USERNAME }}/github_tool:${{ github.sha }}

  gitops-update:
    needs: continuous-integration
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      # 6. Hand-off: Update the separate configuration repository for deployment
      - name: Checkout config repo
        uses: actions/checkout@v4
        with:
          repository: 'avisubir350/config-repo'
          token: ${{ secrets.GITHUB_TOKEN }}
          path: 'config-repo'

      - name: Update Kubernetes manifest
        run: |
          cd config-repo/k8s
          sed -i "s|image:.*|image: ${{ secrets.DOCKER_USERNAME }}/github_tool:${{ github.sha }}|g" deployment.yaml
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add .
          git commit -m "chore: update dev image to ${{ github.sha }} [skip ci]"
          git push origin develop
